name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Rust target (macOS)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BeeTODO ${{ github.ref_name }}'
          releaseBody: |
            BeeTODO 0.2.2 补丁版：

            1. 修复 Windows 和 macOS 无边框主窗口无法拖动的问题。
            2. 兼容旧版 Tauri 拖拽机制，避免点击文字或图标时拖拽失效。
            3. 默认关闭主窗口置顶，并迁移旧版本遗留的置顶状态。
            4. 保留设置面板透明度调节，同时隐藏右侧滚动条。

            支持平台：Windows 11、macOS（Apple Silicon 与 Intel）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
