name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Rust target (macOS)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BeeTODO ${{ github.ref_name }}'
          releaseBody: |
            BeeTODO 0.2.1 补丁版：

            1. 修复 Windows 创建学习便签后主窗口设置、关闭和最小化控件失效的问题。
            2. 修复学习便签桌面磁贴置顶无效果的问题，并隔离不同窗口的置顶状态。
            3. 兼容 macOS、Windows 和其他桌面系统的窗口焦点行为。
            4. 隐藏设置面板右侧滚动条，保留透明度调节和滚动能力。

            支持平台：Windows 11、macOS（Apple Silicon 与 Intel）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
